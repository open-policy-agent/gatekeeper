---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: connections.connection.gatekeeper.sh
spec:
  group: connection.gatekeeper.sh
  names:
    kind: Connection
    listKind: ConnectionList
    plural: connections
    singular: connection
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Connection is the Schema for the connections API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of Connection.
            properties:
              config:
                description: config is the driver-specific configuration for this
                  connection.
                x-kubernetes-preserve-unknown-fields: true
              driver:
                description: driver is the name of one of the expected drivers i.e.
                  dapr, disk
                type: string
            required:
            - config
            - driver
            type: object
          status:
            description: status is the observed state of Connection.
            properties:
              byPod:
                description: byPod lists the observed status of this Connection for
                  each pod.
                items:
                  description: ConnectionPodStatusStatus defines the observed state
                    of ConnectionPodStatus.
                  properties:
                    connectionErrors:
                      description: connectionErrors contains errors from creating
                        or updating the Connection.
                      items:
                        properties:
                          message:
                            description: message is a human-readable description of
                              the error.
                            type: string
                          type:
                            description: |-
                              type indicates a specific class of error for use by controller code. If not
                              present, the error should be treated as not matching any known type.
                            type: string
                        required:
                        - message
                        - type
                        type: object
                      maxItems: 500
                      type: array
                    connectionUID:
                      description: |-
                        connectionUID is the UID of the Connection this status reports on, used to
                        detect drift, such as when the Connection has been recreated after its CRD
                        was deleted out from under it, interrupting the watch.
                      type: string
                    id:
                      description: id is the unique identifier for the pod that wrote
                        the status
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration is the generation of the Connection that was last processed
                        by this pod.
                      format: int64
                      type: integer
                    operations:
                      description: |-
                        operations lists the Gatekeeper operations assigned to the pod that generated
                        this status.
                      items:
                        type: string
                      type: array
                    publishStatuses:
                      description: publishStatuses reports publishing health independently
                        for each source.
                      items:
                        description: ConnectionPublishStatus reports publishing health
                          for one producer.
                        properties:
                          active:
                            description: |-
                              active indicates that the source completed at least one publish in its
                              latest reporting window.
                            type: boolean
                          errors:
                            description: errors contains publish failures reported
                              by this source.
                            items:
                              properties:
                                message:
                                  description: message is a human-readable description
                                    of the error.
                                  type: string
                                type:
                                  description: |-
                                    type indicates a specific class of error for use by controller code. If not
                                    present, the error should be treated as not matching any known type.
                                  type: string
                              required:
                              - message
                              - type
                              type: object
                            maxItems: 500
                            type: array
                          lastAttemptTime:
                            description: lastAttemptTime is the most recent publish
                              attempt represented by this status.
                            format: date-time
                            type: string
                          lastSuccessTime:
                            description: lastSuccessTime is the most recent successful
                              publish by this source.
                            format: date-time
                            type: string
                          source:
                            description: source identifies the producer that owns
                              this status.
                            enum:
                            - audit
                            - webhook
                            type: string
                        required:
                        - source
                        type: object
                      maxItems: 2
                      type: array
                      x-kubernetes-list-map-keys:
                      - source
                      x-kubernetes-list-type: map
                  type: object
                type: array
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
