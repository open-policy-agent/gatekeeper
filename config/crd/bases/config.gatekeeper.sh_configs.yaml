---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: configs.config.gatekeeper.sh
spec:
  group: config.gatekeeper.sh
  names:
    kind: Config
    listKind: ConfigList
    plural: configs
    singular: config
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Config is the Schema for the configs API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of Config.
            properties:
              match:
                description: match is the configuration for namespace exclusion
                items:
                  properties:
                    excludedNamespaces:
                      description: excludedNamespaces lists the namespaces excluded
                        from the listed processes.
                      items:
                        description: |-
                          A string that supports globbing at its front and end. Ex: "kube-*" will match "kube-system" or
                          "kube-public", "*-system" will match "kube-system" or "gatekeeper-system", "*system*" will
                          match "system-kube" or "kube-system".  The asterisk is required for wildcard matching.
                        pattern: ^\*?[-:a-z0-9]*\*?$
                        type: string
                      type: array
                    processes:
                      description: processes lists the Gatekeeper processes this exclusion
                        applies to.
                      items:
                        type: string
                      type: array
                  type: object
                type: array
              readiness:
                description: readiness is the configuration for readiness tracker
                properties:
                  statsEnabled:
                    description: statsEnabled enables reporting of readiness tracker
                      statistics.
                    type: boolean
                type: object
              sync:
                description: sync is the configuration for syncing k8s objects
                properties:
                  syncOnly:
                    description: |-
                      syncOnly restricts replication into OPA to only the entries on this list,
                      when non-empty
                    items:
                      properties:
                        group:
                          description: group is the API group of the resource to sync.
                          type: string
                        kind:
                          description: kind is the kind of the resource to sync.
                          type: string
                        version:
                          description: version is the API version of the resource
                            to sync.
                          type: string
                      type: object
                    type: array
                type: object
              validation:
                description: validation is the configuration for validation
                properties:
                  traces:
                    description: traces is the list of requests to trace. Both "user"
                      and "kinds" must be specified
                    items:
                      properties:
                        dump:
                          description: dump also dumps the state of OPA with the trace.
                            Set to `All` to dump everything.
                          type: string
                        kind:
                          description: kind restricts tracing to requests of the following
                            GroupVersionKind
                          properties:
                            group:
                              description: group is the API group of the resource.
                              type: string
                            kind:
                              description: kind is the kind of the resource.
                              type: string
                            version:
                              description: version is the API version of the resource.
                              type: string
                          type: object
                        user:
                          description: user restricts tracing to requests from the
                            specified user
                          type: string
                      type: object
                    type: array
                type: object
            type: object
          status:
            description: status is the observed state of Config.
            properties:
              byPod:
                description: byPod lists the observed status of this Config for each
                  pod.
                items:
                  properties:
                    configUID:
                      description: |-
                        configUID is the UID of the Config resource this status reports on, used to
                        detect drift, such as when the Config has been recreated after its CRD was
                        deleted out from under it, interrupting the watch.
                      type: string
                    errors:
                      description: errors lists any errors encountered while processing
                        the Config.
                      items:
                        properties:
                          message:
                            description: message is a human-readable description of
                              the error.
                            type: string
                          type:
