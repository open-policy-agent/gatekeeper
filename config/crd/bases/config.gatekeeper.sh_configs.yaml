                    id:
                      description: id is the name of the pod that generated this status.
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration is the generation of the Config that was last processed by
                        this pod.
                      format: int64
                      type: integer
                    operations:
                      description: |-
                        operations lists the Gatekeeper operations assigned to the pod that generated
                        this status.
                      items:
                        type: string
                      type: array
                  type: object
                type: array
            type: object
