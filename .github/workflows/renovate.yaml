name: renovate

# Runs Renovate weekly (Monday 08:00 UTC) and on manual dispatch; self-hosted via the Renovate Action.

on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Log only — open no PRs"
        type: boolean
        default: false
      log_level:
        description: "Renovate log level"
        type: choice
        options: [info, debug]
        default: info

permissions: read-all

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    name: Renovate
    if: github.repository == 'open-policy-agent/gatekeeper' && vars.RENOVATE_APP_ID != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Check out code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      # Manual dry-run opens no PRs and writes nothing.
      - name: Select dry-run mode
        if: inputs.dry_run
        run: echo "RENOVATE_DRY_RUN=full" >> "$GITHUB_ENV"

      # Narrow the processed base branches to the maintained n/n-1 release lines at runtime, so
      # the config's release policy stays a generic regex (no per-release churn).
      - name: Resolve maintained release branches
        run: |
          set -euo pipefail
          maintained=$(
            git ls-remote --heads origin \
              | sed 's#.*refs/heads/##' \
              | grep -E '^release-[0-9]+\.[0-9]+$' \
              | sort -V | tail -2
          ) || true
          if [ -z "${maintained:-}" ]; then echo "no release-*.* branches found on origin" >&2; exit 1; fi
          patterns='"$default"'
          for b in $maintained; do patterns="$patterns,\"$b\""; done
          echo "RENOVATE_BASE_BRANCH_PATTERNS=[$patterns]" >> "$GITHUB_ENV"
          echo "Resolved RENOVATE_BASE_BRANCH_PATTERNS=[$patterns]"

      # Get a token from the GitHub App so Renovate acts as the app bot.
      - name: Generate a token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}

      - name: Get the app's user id
        id: app-user
        run: echo "id=$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Run Renovate
        uses: renovatebot/github-action@316d7cd859606d6039a2182b7d69199e9b036835 # v46.2.1
        with:
          configurationFile: .github/renovate.json5
          token: ${{ steps.app-token.outputs.token }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: "false"
          RENOVATE_PLATFORM: github
          RENOVATE_USERNAME: "${{ steps.app-token.outputs.app-slug }}[bot]"
          RENOVATE_GIT_AUTHOR: "${{ steps.app-token.outputs.app-slug }}[bot] <${{ steps.app-user.outputs.id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com>"
          LOG_LEVEL: ${{ inputs.log_level || 'info' }}
