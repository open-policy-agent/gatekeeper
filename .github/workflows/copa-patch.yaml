name: copa-patch

# Recurring Copa image-patching workflow.
#
# It scans published release images for fixable Go-library CVEs, rebuilds/patches them with
# Copa, re-scans to confirm the fix, re-wraps them with BuildKit SBOM + SLSA provenance
# attestations, and publishes immutable `vX.Y.Z-R` + floating `vX.Y.Z-patched` multi-arch
# tags. Canonical release tags are never touched.
#
# Modes (input `target`; the weekly schedule always runs `canonical`):
#   - dry-run   (default for manual runs): scan/patch only, write a local OCI layout, push nothing.
#   - staging  : push patched (unattested) images to the owner's copa-staging namespace.
#   - canonical: re-wrap WITH attestations and publish to ghcr.io/open-policy-agent/* (GHCR).

on:
  # Weekly canonical run — gated OFF for the initial merge.
  # schedule:
  #   - cron: "17 8 * * 1"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to patch (e.g. v3.23.0). Blank = latest stable + previous minor."
        required: false
        type: string
      target:
        description: "Where to send patched images."
        required: false
        type: choice
        options: [dry-run, staging, canonical]
        default: dry-run

permissions: read-all

# Serialize every scheduled or manual run so two runs can't race
# on the same vX.Y.Z-N revision number or -patched promotion.
concurrency:
  group: copa-patch
  cancel-in-progress: false

env:
  TRIVY_VERSION: "0.69.3"
  COPA_VERSION: "0.14.2"
  CRANE_VERSION: "0.21.7"
  # GHCR is the source registry for the release images to patch and the publish destination.
  SOURCE_REGISTRY: "ghcr.io/open-policy-agent"
  # Arches to patch (all platforms gatekeeper/gator publish).
  PATCH_ARCHES: "linux/amd64 linux/arm64 linux/arm/v7"

jobs:
  resolve-releases:
    name: Resolve target releases
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      releases: ${{ steps.resolve.outputs.matrix }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve releases
        id: resolve
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [[ -n "${RELEASE_TAG}" ]]; then
            if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::release_tag must be a stable vMAJOR.MINOR.PATCH tag, got '${RELEASE_TAG}'"; exit 1
            fi
            matrix=$(jq -cn --arg t "${RELEASE_TAG}" '[$t]')
          else
            # Stable tags only: vMAJOR.MINOR.PATCH (exclude -beta/-rc pre-releases).
            mapfile -t stable < <(git tag | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V)
            if [[ ${#stable[@]} -eq 0 ]]; then
              echo "::error::no stable release tags found"; exit 1
            fi
            latest="${stable[-1]}"
            latest_minor="${latest%.*}" # vX.Y
            prev=$(printf '%s\n' "${stable[@]}" | grep -v "^${latest_minor}\." | sort -V | tail -1 || true)
            if [[ -n "${prev}" ]]; then
              matrix=$(jq -cn --arg a "${latest}" --arg b "${prev}" '[$a,$b]')
            else
              matrix=$(jq -cn --arg a "${latest}" '[$a]')
            fi
          fi
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"
          echo "Resolved releases: ${matrix}"
          echo "### Resolved releases: \`${matrix}\`" >> "$GITHUB_STEP_SUMMARY"

  patch:
    name: Patch ${{ matrix.image }}:${{ matrix.release }}
    needs: resolve-releases
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write # push to GHCR only when target != dry-run
    strategy:
      fail-fast: false
      matrix:
        image: [gatekeeper, gator]
        release: ${{ fromJson(needs.resolve-releases.outputs.releases) }}
    # Matrix values reused across steps.
    env:
      IMAGE: ${{ matrix.image }}
      RELEASE: ${{ matrix.release }}
      # Normalize a raw Trivy report into a deduped finding set (keyed by VulnerabilityID and PkgName).
      NORMALIZE_JQ: |
        [ .Results[]?.Vulnerabilities[]?
          | { id: .VulnerabilityID, pkg: .PkgName, sev: (.Severity // "UNKNOWN"),
              installed: (.InstalledVersion // ""), fixed: (.FixedVersion // "") } ]
        | group_by(.id + "\u0000" + .pkg)
        | map( .[0] + { installed: ([ .[].installed ] | unique),
                        fixed: ([ .[].fixed ] | map(select(. != "")) | unique) } )
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      # Untrusted inputs (release_tag, target) are passed via env and never
      # interpolated directly into run scripts.
      - name: Resolve mode, source + target refs
        id: cfg
        env:
          INPUT_TARGET: ${{ inputs.target }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mode="${INPUT_TARGET:-canonical}"
          case "${mode}" in dry-run|staging|canonical) ;; *) echo "::error::invalid target '${mode}'"; exit 1;; esac
          # Safety: `dry-run` pushes nothing; `staging` pushes only to the owner's own
          # ghcr.io/<owner>/copa-staging/* namespace; `canonical` (the only mode that writes to the
          # official repos) is locked to the upstream repo below.
          if [[ "${mode}" == "canonical" && "${REPO}" != "open-policy-agent/gatekeeper" ]]; then
            echo "::error::target=canonical is only allowed on open-policy-agent/gatekeeper (here: ${REPO})"; exit 1
          fi
          # Staging/intermediate writes are pinned to the owner's dedicated copa-staging namespace.
          staging="ghcr.io/${{ github.repository_owner }}/copa-staging"
          intermediate_repo="${staging}/${IMAGE}"
          source_ref="${SOURCE_REGISTRY}/${IMAGE}:${RELEASE}"
          if [[ "${mode}" == "canonical" ]]; then primary_repo="${SOURCE_REGISTRY}/${IMAGE}"; else primary_repo="${intermediate_repo}"; fi
          {
            echo "mode=${mode}"
            echo "source_ref=${source_ref}"
            echo "intermediate_repo=${intermediate_repo}"
            echo "primary_repo=${primary_repo}"
          } >> "$GITHUB_OUTPUT"
          echo "mode=${mode} | source=${source_ref} | intermediate=${intermediate_repo} | primary=${primary_repo}"

      # Register QEMU for non-amd64 emulated patching.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          image: docker.io/tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0 # qemu-v10.2.3-68

      - name: Set up Buildx
        run: docker buildx create --use --bootstrap

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Trivy
        run: |
          set -euo pipefail
          dir="$(mktemp -d)"
          pushd "${dir}"
          base="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          tarball="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          wget -q "${base}/${tarball}" "${base}/trivy_${TRIVY_VERSION}_checksums.txt"
          grep " ${tarball}\$" "trivy_${TRIVY_VERSION}_checksums.txt" | sha256sum -c -
          tar zxf "${tarball}"
          echo "${dir}" >> "$GITHUB_PATH"
          popd

      - name: Install Copa
        run: |
          set -euo pipefail
          dir="$(mktemp -d)"
          pushd "${dir}"
          base="https://github.com/project-copacetic/copacetic/releases/download/v${COPA_VERSION}"
          tarball="copa_${COPA_VERSION}_linux_amd64.tar.gz"
          wget -q "${base}/${tarball}" "${base}/copacetic_checksums.txt"
          grep " ${tarball}\$" copacetic_checksums.txt | sha256sum -c -
          tar zxf "${tarball}"
          echo "${dir}" >> "$GITHUB_PATH"
          popd

      - name: Install crane
        run: |
          set -euo pipefail
          dir="$(mktemp -d)"
          pushd "${dir}"
          base="https://github.com/google/go-containerregistry/releases/download/v${CRANE_VERSION}"
          tarball="go-containerregistry_Linux_x86_64.tar.gz"
          wget -q "${base}/${tarball}" "${base}/checksums.txt"
          grep " ${tarball}\$" checksums.txt | sha256sum -c -
          tar zxf "${tarball}" crane
          echo "${dir}" >> "$GITHUB_PATH"
          popd

      - name: Download Trivy DB
        run: |
          trivy image --download-db-only \
            --db-repository=ghcr.io/aquasecurity/trivy-db,public.ecr.aws/aquasecurity/trivy-db,docker.io/aquasec/trivy-db

      # Record the canonical release tag digest up front, to confirm afterwards that the run
      # never mutated a canonical `vX.Y.Z` tag (only `-R`/`-patched` are added).
      - name: Capture canonical base digest
        id: base
        if: steps.cfg.outputs.mode == 'canonical'
        run: |
          set -euo pipefail
          ghcr=$(crane digest "${SOURCE_REGISTRY}/${IMAGE}:${RELEASE}")
          echo "ghcr=${ghcr}" >> "$GITHUB_OUTPUT"
          echo "Canonical base digest — ghcr:${ghcr}"

      # Scan the canonical source per arch. The reports Copa consumes live in copa-reports/
      # (one per platform => Copa patches exactly those arches).
      - name: Scan source for fixable library CVEs
        id: scan
        env:
          SOURCE_REF: ${{ steps.cfg.outputs.source_ref }}
        run: |
          set -euo pipefail
          mkdir -p copa-reports
          total=0
          stdlib_total=0
          for p in $PATCH_ARCHES; do
            a="${p#linux/}"; a="${a//\//-}" # arm/v7 -> arm-v7 so the report is a flat file
            trivy image --quiet --platform "$p" --pkg-types library --ignore-unfixed \
              -f json -o "copa-reports/${a}.json" "${SOURCE_REF}"
            arch_total=$(jq '[.Results[]?.Vulnerabilities[]?] | length' "copa-reports/${a}.json")
            arch_stdlib=$(jq '[.Results[]?.Vulnerabilities[]? | select(.PkgName == "stdlib")] | length' "copa-reports/${a}.json")
            total=$(( total + arch_total ))
            stdlib_total=$(( stdlib_total + arch_stdlib ))
            echo "  ${a}: fixable=${arch_total} (stdlib=${arch_stdlib})"
          done
          echo "before=${total}" >> "$GITHUB_OUTPUT"
          echo "Fixable library CVEs in ${SOURCE_REF} (${PATCH_ARCHES}): ${total} (stdlib=${stdlib_total})"

      # Skip only when the image users actually pull is already clean
      # (an existing -patched with no fixable CVEs, or a clean source before any -patched exists).
      - name: Skip-gate + idempotency check
        id: gate
        env:
          PRIMARY_REPO: ${{ steps.cfg.outputs.primary_repo }}
          SOURCE_REF: ${{ steps.cfg.outputs.source_ref }}
          MODE: ${{ steps.cfg.outputs.mode }}
          BEFORE: ${{ steps.scan.outputs.before }}
        run: |
          set -euo pipefail
          patch_input="${SOURCE_REF}"
          report_dir="copa-reports"
          # Classify the lookup: present = scan it; explicit not-found = first patch;
          # operational error = fail closed in canonical so we never skip/patch on an unknown state.
          existing=0
          patched_state="absent"
          if [[ "${MODE}" != "dry-run" ]]; then
            if digest_out=$(crane digest "${PRIMARY_REPO}:${RELEASE}-patched" 2>&1 >/dev/null); then
              patched_state="present"
            elif grep -qiE 'MANIFEST_UNKNOWN|manifest unknown|not found|404' <<<"${digest_out}"; then
              patched_state="absent"
            elif [[ "${MODE}" == "canonical" ]]; then
              echo "::error::could not determine whether ${PRIMARY_REPO}:${RELEASE}-patched exists (registry error): ${digest_out}"; exit 1
            else
              patched_state="absent"
            fi
            if [[ "${patched_state}" == "present" ]]; then
              mkdir -p copa-reports-patched
              for p in $PATCH_ARCHES; do
                a="${p#linux/}"; a="${a//\//-}"
                trivy image --quiet --platform "$p" --pkg-types library --ignore-unfixed \
                  -f json -o "copa-reports-patched/${a}.json" "${PRIMARY_REPO}:${RELEASE}-patched"
                existing=$(( existing + $(jq '[.Results[]?.Vulnerabilities[]?] | length' "copa-reports-patched/${a}.json") ))
              done
            fi
          fi
          # Skip only when what users pull is already clean.
          if [[ "${patched_state}" == "present" ]]; then
            if [[ "${existing}" -eq 0 ]]; then
              echo "has_fixes=false" >> "$GITHUB_OUTPUT"
              echo "Existing ${RELEASE}-patched already fixes all current CVEs — skipping (idempotent)." | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          elif [[ "${BEFORE}" -eq 0 ]]; then
            echo "has_fixes=false" >> "$GITHUB_OUTPUT"
            echo "Source has no fixable library CVEs and no -patched exists, nothing to patch." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ "${BEFORE}" -eq 0 && "${existing}" -gt 0 ]]; then
            patch_input="${PRIMARY_REPO}:${RELEASE}-patched"
            report_dir="copa-reports-patched"
            echo "Source clean; re-patching existing ${RELEASE}-patched (${existing} fixable CVE(s))." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          {
            echo "has_fixes=true"
            echo "patch_input=${patch_input}"
            echo "report_dir=${report_dir}"
          } >> "$GITHUB_OUTPUT"

      # Immutable revision = next integer after the highest existing vX.Y.Z-N in the primary repo
      # (the staging repo for `staging`, the canonical GHCR repo for `canonical`).
      - name: Compute revision
        id: rev
        if: steps.gate.outputs.has_fixes == 'true'
        env:
          PRIMARY_REPO: ${{ steps.cfg.outputs.primary_repo }}
          MODE: ${{ steps.cfg.outputs.mode }}
        run: |
          set -euo pipefail
          if [[ "${MODE}" != "dry-run" ]]; then
            if [[ "${MODE}" == "canonical" ]]; then
              tags=$(crane ls "${PRIMARY_REPO}")
            else
              tags=$(crane ls "${PRIMARY_REPO}" 2>/dev/null || true)
            fi
            # empty result here means only "no vX.Y.Z-N tags yet", not a failed lookup.
            last=$(printf '%s\n' "${tags}" | { grep -E "^${RELEASE}-[0-9]+$" || true; } | sed "s/^${RELEASE}-//" | sort -n | tail -1)
            rev=$(( ${last:-0} + 1 ))
            if [[ "${MODE}" == "canonical" ]]; then
              if digest_err=$(crane digest "${PRIMARY_REPO}:${RELEASE}-${rev}" 2>&1 >/dev/null); then
                echo "::error::${PRIMARY_REPO}:${RELEASE}-${rev} already exists; refusing to overwrite an immutable revision"; exit 1
              elif grep -qiE 'MANIFEST_UNKNOWN|manifest unknown|not found|404' <<<"${digest_err}"; then
                :
              else
                echo "::error::could not confirm ${PRIMARY_REPO}:${RELEASE}-${rev} is absent (registry error): ${digest_err}"; exit 1
              fi
            elif crane digest "${PRIMARY_REPO}:${RELEASE}-${rev}" >/dev/null 2>&1; then
              echo "::error::${PRIMARY_REPO}:${RELEASE}-${rev} already exists; refusing to overwrite an immutable revision"; exit 1
            fi
          else
            rev="dryrun"
          fi
          echo "rev=${rev}" >> "$GITHUB_OUTPUT"
          echo "Revision: ${RELEASE}-${rev}"

      # Report-driven multi-arch patch: Copa patches every arch with a report in the chosen report dir
      # and passes any other arch through untouched. Input is the source, or the existing -patched when
      # the source is clean but the -patched drifted into a fixable CVE.
      - name: Copa patch
        id: patch
        if: steps.gate.outputs.has_fixes == 'true'
        env:
          PATCH_INPUT: ${{ steps.gate.outputs.patch_input }}
          REPORT_DIR: ${{ steps.gate.outputs.report_dir }}
          INTERMEDIATE_REPO: ${{ steps.cfg.outputs.intermediate_repo }}
          MODE: ${{ steps.cfg.outputs.mode }}
          REV: ${{ steps.rev.outputs.rev }}
        run: |
          set -euo pipefail
          tag="${RELEASE}-${REV}"
          if [[ "${MODE}" == "dry-run" ]]; then
            out=(--oci-dir ./patched-oci)
            echo "patched_ref=./patched-oci" >> "$GITHUB_OUTPUT"
          else
            out=(--push)
            echo "patched_ref=${INTERMEDIATE_REPO}:${tag}" >> "$GITHUB_OUTPUT"
          fi
          COPA_EXPERIMENTAL=1 copa patch \
            -i "${PATCH_INPUT}" \
            --report "${REPORT_DIR}/" \
            --pkg-types library \
            --library-patch-level patch \
            --toolchain-patch-level patch \
            --ignore-errors \
            --timeout 120m \
            "${out[@]}" \
            -t "${INTERMEDIATE_REPO}:${tag}"

      # Guard: every target arch must be present in the pushed index. Copa silently *ignores* an
      # arch it can't emulate instead of failing, so without this a drop would ship a -patched
      # index missing an arch.
      - name: Verify all target arches present
        if: steps.gate.outputs.has_fixes == 'true' && steps.cfg.outputs.mode != 'dry-run'
        env:
          PATCHED_REF: ${{ steps.patch.outputs.patched_ref }}
        run: |
          set -euo pipefail
          present=$(docker buildx imagetools inspect "${PATCHED_REF}" --raw \
            | jq -r '.manifests[]? | select(.platform.os == "linux" and .platform.architecture != "unknown")
                     | .platform | .os + "/" + .architecture + (if .variant then "/" + .variant else "" end)')
          echo "Arches in ${PATCHED_REF}:"; echo "${present}"
          spaced=" $(echo ${present}) "   # collapse to a single space-delimited line for matching
          missing=""
          for p in $PATCH_ARCHES; do
            case "${spaced}" in *" ${p} "*) : ;; *) missing="${missing} ${p}" ;; esac
          done
          if [[ -n "${missing}" ]]; then
            echo "::error::patched index ${PATCHED_REF} is missing target arch(es):${missing}"; exit 1
          fi
          echo "All target arches present in the patched index."

      # Verify the patch reduced fixable CVEs, deriving every number from one normalized finding set.
      - name: Verify patched image (re-scan)
        id: verify
        if: steps.gate.outputs.has_fixes == 'true'
        env:
          PATCHED_REF: ${{ steps.patch.outputs.patched_ref }}
          MODE: ${{ steps.cfg.outputs.mode }}
          REV: ${{ steps.rev.outputs.rev }}
          REPORT_DIR: ${{ steps.gate.outputs.report_dir }}
        run: |
          set -euo pipefail
          before_total=0; before_stdlib=0
          after_total=0; after_stdlib=0; after_library=0
          existing_present=0; improved_vs_existing=0
          residual_md=""; unimproved=""; regressed=""; regressed_vs_existing=""
          {
            echo "### ${IMAGE}:${RELEASE} - ${RELEASE}-${REV} (${MODE})"
            echo ""
            echo "| Arch | fixable (before - after) | stdlib | library residual |"
            echo "| --- | --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "${MODE}" == "dry-run" ]]; then
            cp "${PATCHED_REF}/index.json" "${PATCHED_REF}/index.json.orig"
            trap 'mv -f "${PATCHED_REF}/index.json.orig" "${PATCHED_REF}/index.json" 2>/dev/null || true' EXIT
          fi
          for p in $PATCH_ARCHES; do
            a="${p#linux/}"; a="${a//\//-}"
            if [[ "${MODE}" == "dry-run" ]]; then
              # Resolve this arch manifest, scan a single-manifest index, then assert the arch.
              want="${p#linux/}"; want="${want%%/*}"
              dig=$(jq -r --arg ar "${want}" '.manifests[] | select(.platform.os=="linux" and .platform.architecture==$ar) | .digest' "${PATCHED_REF}/index.json.orig")
              [[ -n "${dig}" ]] || { echo "::error::no ${p} manifest in ${PATCHED_REF}"; exit 1; }
              jq --arg d "${dig}" '{schemaVersion:2, mediaType:"application/vnd.oci.image.index.v1+json", manifests:[.manifests[]|select(.digest==$d)]}' "${PATCHED_REF}/index.json.orig" > "${PATCHED_REF}/index.json"
              trivy image --quiet --input "${PATCHED_REF}" --pkg-types library --ignore-unfixed \
                -f json -o "scan-after-${a}.json"
              got=$(jq -r '.Metadata.ImageConfig.architecture // ""' "scan-after-${a}.json")
              [[ "${got}" == "${want}" ]] || { echo "::error::dry-run ${p}: scanned arch '${got}', expected '${want}'"; exit 1; }
            else
              trivy image --quiet --platform "$p" --pkg-types library --ignore-unfixed \
                -f json -o "scan-after-${a}.json" "${PATCHED_REF}"
            fi
            jq "$NORMALIZE_JQ" "${REPORT_DIR}/${a}.json" > "norm-source-${a}.json"
            jq "$NORMALIZE_JQ" "scan-after-${a}.json"  > "norm-after-${a}.json"
            read -r a_before a_before_stdlib < <(jq -r '[length, ([.[] | select(.pkg == "stdlib")] | length)] | @tsv' "norm-source-${a}.json")
            read -r a_after a_after_stdlib a_after_library < <(jq -r '[length, ([.[] | select(.pkg == "stdlib")] | length), ([.[] | select(.pkg != "stdlib")] | length)] | @tsv' "norm-after-${a}.json")
            before_total=$(( before_total + a_before )); before_stdlib=$(( before_stdlib + a_before_stdlib ))
            after_total=$(( after_total + a_after )); after_stdlib=$(( after_stdlib + a_after_stdlib )); after_library=$(( after_library + a_after_library ))
            # Compare against the existing -patched per arch, so a win on one arch can't hide a regression on another when deciding whether to publish.
            if [[ -f "copa-reports-patched/${a}.json" ]]; then
              existing_present=1
              jq "$NORMALIZE_JQ" "copa-reports-patched/${a}.json" > "norm-existing-${a}.json"
              a_existing=$(jq 'length' "norm-existing-${a}.json")
              if [[ "${a_after}" -gt "${a_existing}" ]]; then
                regressed_vs_existing+=" ${p}(${a_existing}->${a_after})"
              elif [[ "${a_after}" -lt "${a_existing}" ]]; then
                improved_vs_existing=1
              fi
            fi
            # A per-arch increase vs source is a regression (fail later); an equal count is best-effort (warn).
            if [[ "${a_after}" -gt "${a_before}" ]]; then
              regressed+=" ${p}(${a_before}->${a_after})"
            elif [[ "${a_before}" -gt 0 && "${a_after}" -eq "${a_before}" ]]; then
              unimproved+=" ${p}(${a_before}->${a_after})"
            fi
            echo "  ${a}: before=${a_before} after=${a_after} (stdlib=${a_after_stdlib} library=${a_after_library})"
            echo "| ${p} | ${a_before} → ${a_after} | ${a_before_stdlib} → ${a_after_stdlib} | ${a_after_library} |" >> "$GITHUB_STEP_SUMMARY"
            pkgs=$(jq -r '[.[] | select(.pkg != "stdlib")] | group_by(.pkg)[]
                          | "- " + .[0].pkg + " " + (.[0].installed | join(",")) + " → needs " + ([.[].fixed[]] | unique | join(", "))' "norm-after-${a}.json")
            if [[ -n "${pkgs}" ]]; then
              residual_md+=$'\n'"**${p}**"$'\n\n'"${pkgs}"$'\n'
            fi
          done
          [[ $(( after_stdlib + after_library )) -eq "${after_total}" ]] || { echo "::error::finding-set partition invariant violated (stdlib ${after_stdlib} + library ${after_library} != total ${after_total})"; exit 1; }
          sev_line=$(jq -rs 'add | group_by(.sev) | map("\(.[0].sev)=\(length)") | join(" ")' norm-after-*.json)
          echo "CVE totals across ${PATCH_ARCHES}: before=${before_total} after=${after_total} | stdlib ${before_stdlib}→${after_stdlib} | library=${after_library} | severities: ${sev_line}"
          echo "| **all** | **${before_total} → ${after_total}** | **${before_stdlib} → ${after_stdlib}** | **${after_library}** |" >> "$GITHUB_STEP_SUMMARY"
          echo "Residual severities: ${sev_line:-none}" >> "$GITHUB_STEP_SUMMARY"
          if [[ -n "${residual_md}" ]]; then
            {
              echo ""
              echo "<details><summary>${after_library} fixable library CVE(s) remain; Copa could not reach these fixed versions</summary>"
              echo ""
              printf '%s\n' "${residual_md}"
              echo "</details>"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::${after_library} fixable library CVE(s) remain after patching."
          fi
          # Fail on any per-arch regression.
          if [[ -n "${regressed}" ]]; then
            echo "::error::patch increased fixable CVEs vs source on:${regressed}"
            exit 1
          fi
          if [[ -n "${unimproved}" ]]; then
            echo "::warning::arch(es) with unchanged fixable CVE count (best-effort; Copa could not reduce):${unimproved}"
            echo "> **Unchanged fixable CVE count (best-effort):**${unimproved}" >> "$GITHUB_STEP_SUMMARY"
          fi
          # Surface any stdlib CVEs left unfixed by --toolchain-patch-level.
          if [[ "${after_stdlib}" -gt 0 ]]; then
            echo "::warning::${after_stdlib} Go stdlib CVE(s) remain after toolchain patch (may require a newer Go minor)"
          fi
          # Publish only when the candidate regresses on no arch vs the existing -patched and improves on
          # at least one — per arch.
          if [[ "${existing_present}" -eq 1 && -n "${regressed_vs_existing}" ]]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Candidate regresses vs existing ${RELEASE}-patched on:${regressed_vs_existing} — skipping publish." | tee -a "$GITHUB_STEP_SUMMARY"
          elif [[ "${existing_present}" -eq 1 && "${improved_vs_existing}" -ne 1 ]]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Candidate does not improve on existing ${RELEASE}-patched — skipping publish." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      # Smoke-test the verified intermediate before publishing canonical tags or moving -patched,
      # so a broken binary can never reach a published vX.Y.Z-R / -patched.
      - name: Smoke test patched image
        if: steps.gate.outputs.has_fixes == 'true' && steps.cfg.outputs.mode != 'dry-run' && steps.verify.outputs.publish == 'true'
        env:
          PATCHED_REF: ${{ steps.patch.outputs.patched_ref }}
        run: |
          set -euo pipefail
          for p in $PATCH_ARCHES; do
            set +e
            out=$(docker run --rm --pull always --platform "$p" "${PATCHED_REF}" --help 2>&1)
            ec=$?
            set -e
            if [[ "${ec}" != "0" ]]; then
              echo "::error::smoke test failed for ${PATCHED_REF} on ${p} (exit ${ec})"
              printf '%s\n' "${out}" | head -20
              exit 1
            fi
            echo "Smoke: ${PATCHED_REF} (${p}) --help exited 0."
          done

      # Re-wrap the patched image with attestations and push it to a staging RC tag and NOT the canonical
      # -R. Every guard runs against the RC so the immutable -R is only published once they all pass.
      - name: Re-wrap with attestations to staging RC
        id: rewrap
        if: steps.gate.outputs.has_fixes == 'true' && steps.cfg.outputs.mode == 'canonical' && steps.verify.outputs.publish == 'true'
        env:
          INTERMEDIATE_REF: ${{ steps.patch.outputs.patched_ref }}
          REV: ${{ steps.rev.outputs.rev }}
        run: |
          set -euo pipefail
          rc_ref="${INTERMEDIATE_REF}-rc"
          platforms=$(docker buildx imagetools inspect "${INTERMEDIATE_REF}" --raw \
            | jq -r '[ .manifests[]
                       | select(.platform != null and .platform.os != null and .platform.architecture != "unknown")
                       | .platform | (.os + "/" + .architecture + (if .variant then "/" + .variant else "" end)) ]
                     | unique | join(",")')
          if [[ -z "${platforms}" ]]; then echo "::error::could not determine platforms to re-wrap"; exit 1; fi
          echo "Re-wrapping platforms: ${platforms}"
          workdir="$(mktemp -d)"
          printf 'FROM %s\n' "${INTERMEDIATE_REF}" > "${workdir}/Dockerfile"
          docker buildx build \
            --platform "${platforms}" \
            --attest type=sbom \
            --attest type=provenance,mode=max \
            -t "${rc_ref}" \
            --push \
            "${workdir}"
          echo "rc_ref=${rc_ref}" >> "$GITHUB_OUTPUT"

      - name: Verify attestations present
        if: steps.gate.outputs.has_fixes == 'true' && steps.cfg.outputs.mode == 'canonical' && steps.verify.outputs.publish == 'true'
        env:
          RC_REF: ${{ steps.rewrap.outputs.rc_ref }}
        run: |
          set -euo pipefail
          repo="${RC_REF%:*}"
          idx=$(crane manifest "${RC_REF}")
          # Every platform manifest must have its own attestation manifest carrying BOTH an SBOM and a
          # SLSA provenance predicate.
          mapfile -t imgs < <(jq -r '.manifests[] | select(.platform.os == "linux" and .platform.architecture != "unknown") | .digest' <<<"${idx}")
          want=$(echo ${PATCH_ARCHES} | wc -w | tr -d ' ')
          [[ "${#imgs[@]}" -eq "${want}" ]] || { echo "::error::${RC_REF}: expected ${want} platform manifests, found ${#imgs[@]}"; exit 1; }
          for imgd in "${imgs[@]}"; do
            attd=$(jq -r --arg d "${imgd}" '.manifests[] | select(.annotations["vnd.docker.reference.type"] == "attestation-manifest" and .annotations["vnd.docker.reference.digest"] == $d) | .digest' <<<"${idx}")
            [[ -n "${attd}" ]] || { echo "::error::${RC_REF}: platform ${imgd} has no attestation manifest"; exit 1; }
            preds=$(crane manifest "${repo}@${attd}" | jq -r '.layers[].annotations["in-toto.io/predicate-type"] // empty')
            grep -q 'spdx.dev' <<<"${preds}" || { echo "::error::${RC_REF}: platform ${imgd} missing SBOM attestation"; exit 1; }
            grep -q 'slsa.dev/provenance' <<<"${preds}" || { echo "::error::${RC_REF}: platform ${imgd} missing provenance attestation"; exit 1; }
            echo "  ${imgd}: SBOM + provenance present."
          done
          echo "All ${#imgs[@]} candidate platform(s) carry SBOM + provenance attestations."

      # prove the run never mutated a canonical release tag.
      - name: Verify canonical release tag untouched
        if: steps.gate.outputs.has_fixes == 'true' && steps.cfg.outputs.mode == 'canonical' && steps.verify.outputs.publish == 'true'
        env:
          BASE_GHCR: ${{ steps.base.outputs.ghcr }}
        run: |
          set -euo pipefail
          now_ghcr=$(crane digest "${SOURCE_REGISTRY}/${IMAGE}:${RELEASE}")
          if [[ "${now_ghcr}" != "${BASE_GHCR}" ]]; then
            echo "::error::canonical release tag digest changed (ghcr ${BASE_GHCR}->${now_ghcr})"; exit 1
          fi
          echo "Canonical release tag unchanged (ghcr ${now_ghcr})."

      - name: Promote validated image to canonical
        if: steps.gate.outputs.has_fixes == 'true' && steps.cfg.outputs.mode == 'canonical' && steps.verify.outputs.publish == 'true'
        env:
          RC_REF: ${{ steps.rewrap.outputs.rc_ref }}
          REV: ${{ steps.rev.outputs.rev }}
        run: |
          set -euo pipefail
          rtag="${SOURCE_REGISTRY}/${IMAGE}:${RELEASE}-${REV}"
          if digest_err=$(crane digest "${rtag}" 2>&1 >/dev/null); then
            echo "::error::${rtag} already exists; refusing to overwrite an immutable revision"; exit 1
          elif grep -qiE 'MANIFEST_UNKNOWN|manifest unknown|not found|404' <<<"${digest_err}"; then
            :
          else
            echo "::error::could not confirm ${rtag} is absent (registry error): ${digest_err}"; exit 1
          fi
          crane copy "${RC_REF}" "${rtag}"
          rc_digest=$(crane digest "${RC_REF}")
          got_digest=$(crane digest "${rtag}")
          if [[ "${got_digest}" != "${rc_digest}" ]]; then
            echo "::error::canonical ${rtag} digest ${got_digest} != validated RC ${rc_digest}"; exit 1
          fi
          echo "Published attested ${rtag} (digest ${got_digest}) from validated RC." | tee -a "$GITHUB_STEP_SUMMARY"

      # Move the floating -patched tag onto the just verified immutable revision.
      - name: Promote floating -patched tag
        if: steps.gate.outputs.has_fixes == 'true' && steps.cfg.outputs.mode != 'dry-run' && steps.verify.outputs.publish == 'true'
        env:
          MODE: ${{ steps.cfg.outputs.mode }}
          INTERMEDIATE_REPO: ${{ steps.cfg.outputs.intermediate_repo }}
          REV: ${{ steps.rev.outputs.rev }}
        run: |
          set -euo pipefail
          if [[ "${MODE}" == "staging" ]]; then
            crane tag "${INTERMEDIATE_REPO}:${RELEASE}-${REV}" "${RELEASE}-patched"
            echo "Published ${INTERMEDIATE_REPO}:${RELEASE}-${REV} and moved ${RELEASE}-patched onto it." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            crane tag "${SOURCE_REGISTRY}/${IMAGE}:${RELEASE}-${REV}" "${RELEASE}-patched"
            echo "Published attested ${SOURCE_REGISTRY}/${IMAGE}:${RELEASE}-${REV} and moved ${RELEASE}-patched onto it." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Confirm no registry writes (dry-run)
        if: steps.gate.outputs.has_fixes == 'true' && steps.cfg.outputs.mode == 'dry-run'
        run: |
          set -euo pipefail
          test -f ./patched-oci/index.json
          echo "Dry-run: OCI layout written locally; nothing pushed. Platforms present:"
          jq -r '.manifests[] | select(.platform != null) | "\(.platform.os)/\(.platform.architecture)"' \
            ./patched-oci/index.json || true
